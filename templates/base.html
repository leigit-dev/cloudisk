<!-- ============================================================
     templates/base.html
     ============================================================ -->
{% from "icon_svg.html" import icon_js %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ClouDisk{% endblock %}</title>
<script>
  // 提前应用主题，避免闪烁
  (function () {
    try {
      var t = localStorage.getItem('cd_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<script>{{ icon_js()|safe }}</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
